seed: 42
device: cpu
epochs: 1

data:
  batch_size: 512
  num_workers: 0
  pin_memory: false
  drop_last: true
  prefetch_factor: 4
  shuffle_buffer: 0

compile:
  enabled: false
  mode: default

optimizer:
  type: ftrl      # ftrl | adamw | adam | sgd | adagrad | rmsprop
  lr: 0.1         # learning rate
  beta: 1.0       # FTRL beta
  lambda1: 1.0    # FTRL l1 regularization
  lambda2: 1.0    # FTRL l2 regularization

scheduler:
  warmup_steps: 0
  decay_rate: 0
  learning_rate_min: 0.000001

checkpoint:
  monitor: val_gauc
  mode: max

logging:
  verbose: true

early_stop:
  enabled: false

evaluation: {}

inspector:
  enabled: false
  log_first: 3
  log_every: 0
