seed: 42
device: cpu
epochs: 1
data:
  batch_size: 512
  num_workers: 4
  pin_memory: false
  drop_last: false
  prefetch_factor: 4
  shuffle_buffer: 8192
  shuffle_files: false
compile:
  enabled: false
optimizer:
  type: adamw  # adamw | adam | sgd | adagrad | rmsprop
  lr: 0.001
  weight_decay: 0.00001
scheduler:
  type: none
checkpoint:
  monitor: val_auc
  mode: max
logging:
  verbose: true
early_stop:
  enabled: false
evaluation: {}
inspector:
  enabled: false

slim:
  beta: 1.0
  lambda: 0.5
  max_iter: 500
  tol: 1e-4
  top_k: 50
  max_samples: 0
  shuffle_buffer: 8192
