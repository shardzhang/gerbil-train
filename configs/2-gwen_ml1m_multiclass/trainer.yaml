seed: 42
device: cpu
epochs: 5

data:
  batch_size: 512
  num_workers: 4
  pin_memory: false
  drop_last: true
  prefetch_factor: 4

compile:
  enabled: false
  mode: default

loss:
  type: nce                      # ce | nce | sampled_softmax | bpr
  num_neg: 50                  # negative samples per positive

optimizer:
  type: adam
  lr: 0.001
  weight_decay: 0.00001

scheduler:
  warmup_steps: 0
  decay_rate: 0
  learning_rate_min: 0.000001

checkpoint:
  monitor: val_hit@1
  mode: max

early_stop:
  enabled: false

logging:
  verbose: true

evaluation: {}
inspector:
  enabled: false
  log_first: 3
  log_every: 0
